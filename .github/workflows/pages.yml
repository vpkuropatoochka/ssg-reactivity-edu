name: Build and publish Lektor

on:
  push:
    branches: ['**']
  workflow_dispatch:
    inputs:
      helios_mode:
        description: Helios operation
        type: choice
        options: [deploy, interrupt-preview, rollback]
        default: deploy

permissions:
  contents: read

concurrency: publish-reactivity-${{ github.ref }}

jobs:
  build:
    name: Build and check site
    if: github.ref_type == 'branch' && inputs.helios_mode != 'rollback'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Build static site
        run: lektor --project website build --output-path "$PWD/build" --buildstate-path "$RUNNER_TEMP/lektor-state"

      - name: Check links and record commit
        run: |
          python scripts/check-site.py --root build
          python scripts/check-site.py --root build --base-path /subdir/reactivity/
          printf '%s\n' "$GITHUB_SHA" > build/revision.txt

      - name: Upload site for GitHub Pages
        if: github.ref == 'refs/heads/main' && inputs.helios_mode != 'interrupt-preview'
        uses: actions/upload-pages-artifact@v4
        with:
          path: build

      - name: Upload site for Helios
        if: vars.HELIOS_ENABLED == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: helios-site
          path: build
          if-no-files-found: error
          retention-days: 1

  deploy-pages:
    name: Publish to GitHub Pages
    if: github.ref == 'refs/heads/main' && inputs.helios_mode != 'interrupt-preview'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
        id: pages

      - name: Verify GitHub Pages response
        env:
          SITE_URL: ${{ steps.pages.outputs.page_url }}
        run: |
          for delay in 1 2 4 8 16; do
            if bash scripts/check-delivery.sh "$SITE_URL" "$GITHUB_SHA"; then exit 0; fi
            sleep "$delay"
          done
          bash scripts/check-delivery.sh "$SITE_URL" "$GITHUB_SHA"

  deploy-helios:
    name: Publish to Helios
    if: >-
      !cancelled() && github.ref_type == 'branch' &&
      vars.HELIOS_ENABLED == 'true' &&
      (needs.build.result == 'success' || inputs.helios_mode == 'rollback')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Download site for Helios
        if: inputs.helios_mode != 'rollback'
        uses: actions/download-artifact@v8
        with:
          name: helios-site
          path: build

      - name: Publish to Helios
        env:
          HELIOS_USER: ${{ secrets.HELIOS_USER }}
          HELIOS_SSH_KEY: ${{ secrets.HELIOS_SSH_KEY }}
          HELIOS_KNOWN_HOSTS: ${{ vars.HELIOS_KNOWN_HOSTS }}
          HELIOS_URL: ${{ vars.HELIOS_URL }}
          HELIOS_MODE: ${{ inputs.helios_mode || 'deploy' }}
        run: bash scripts/deploy-helios.sh "$HELIOS_MODE"
